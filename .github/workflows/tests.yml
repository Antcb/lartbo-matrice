# Tests automatiques de la Matrice : à chaque push (branches de développement et main)
# et à chaque demande de fusion vers main. Aucune connexion à la production, aucun secret.
name: Tests
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04   # figé : Playwright 1.56 ne prend pas en charge ubuntu 26.04 (ubuntu-latest a changé le 07/11/2026)
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Installation des outils de test
        run: npm ci --no-audit --no-fund
      - name: Contrôles statiques (syntaxe, imports, versions, fenêtres natives, secrets)
        run: node static/check.mjs
      - name: Message glissé depuis Apple Mail (lecture du Message-ID, action en lecture seule des scripts Google)
        run: node static/message-id.mjs
      - name: Boîte anthony@ réservée à son titulaire (relais signé, scripts Google simulés)
        run: node --experimental-strip-types --no-warnings static/acces-boite.mjs
      - name: Conversation entière d'un mail glissé (scripts Google simulés, lecture seule)
        run: node --experimental-strip-types --no-warnings static/conversation.mjs
      - name: Syntaxe des fonctions serveur (une fonction qui ne démarrerait pas une fois déployée)
        run: node --no-warnings static/fonctions-syntaxe.mjs
      - name: Règles de la synchronisation Pennylane (fausses données, aucun appel)
        run: node --experimental-strip-types --no-warnings static/pennylane-regles.mjs
      - name: Règles de la synchronisation Brevo (fausses données, aucun appel)
        run: node --experimental-strip-types --no-warnings static/brevo-regles.mjs
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests dans le navigateur (fausse base, réseau extérieur bloqué)
        run: npx playwright test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapport-tests
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
