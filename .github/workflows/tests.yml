# Tests automatiques de la Matrice : à chaque push sur une branche de développement
# et à chaque demande de fusion vers main. Aucune connexion à la production, aucun secret.
name: Tests
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Installation des outils de test
        run: npm ci --no-audit --no-fund
      - name: Contrôles statiques (syntaxe, imports, versions, fenêtres natives, secrets)
        run: node static/check.mjs
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests dans le navigateur (fausse base, réseau extérieur bloqué)
        run: npx playwright test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
