<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
:root{
  --bg:#ECEEF1; --panel:#FFFFFF; --ink:#1B2130; --muted:#5E6676; --line:#D5D9E0; --soft:#F5F6F8;
  --accent:#2C47C9; --accent-ink:#FFFFFF;
  --st-int:#C98A12; --st-opt:#2F64D6; --st-conf:#17865B; --st-off:#A9433A; --st-book:#7A8090;
  --warn:#C98A12; --danger:#B53A30; --ok:#17865B;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161D; --panel:#1B1F28; --ink:#E7EAF0; --muted:#9AA2B2; --line:#2C3240; --soft:#20252F;
    --accent:#7C93FF; --accent-ink:#0E1220;
    --st-int:#E3A93A; --st-opt:#6E97F2; --st-conf:#3DBB87; --st-off:#E0766B; --st-book:#8D93A3;
  }
}
:root[data-theme="dark"]{
  --bg:#13161D; --panel:#1B1F28; --ink:#E7EAF0; --muted:#9AA2B2; --line:#2C3240; --soft:#20252F;
  --accent:#7C93FF; --accent-ink:#0E1220;
  --st-int:#E3A93A; --st-opt:#6E97F2; --st-conf:#3DBB87; --st-off:#E0766B; --st-book:#8D93A3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 100}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barre du haut */
.top{position:sticky;top:0;z-index:500;background:var(--panel);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:800;font-variation-settings:"wdth" 70;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:var(--radius);cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.who{color:var(--muted);font-size:12px;white-space:nowrap}

main{padding:20px;max-width:1600px;margin:0 auto}
.view-head{display:flex;align-items:baseline;gap:16px;margin:0 0 14px;flex-wrap:wrap}
.view-head h1{font-size:26px;margin:0;font-weight:800;font-variation-settings:"wdth" 75;letter-spacing:-.01em}
.view-head .sub{color:var(--muted)}
.view-head .spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:var(--radius);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.search{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);min-width:220px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}

/* Statuts */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.st.int{--c:var(--st-int)} .st.opt{--c:var(--st-opt)} .st.conf{--c:var(--st-conf)} .st.off{--c:var(--st-off)} .st.book{--c:var(--st-book)}

/* Booking : liste + carte */
.booking{display:grid;grid-template-columns:minmax(380px,1fr) 1.15fr;gap:16px;align-items:start}
.booking .map-wrap{position:sticky;top:76px}
#map{height:calc(100vh - 230px);min-height:420px;border-radius:var(--radius);border:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 2px;color:var(--muted)}
.route-box{margin-top:10px;padding:12px}
.route-box h3{margin:0 0 6px;font-size:14px}
.legs{margin:8px 0 0;padding:0;list-style:none;max-height:220px;overflow:auto}
.legs li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.legs .km{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.legs .long{color:var(--danger)}

.month{margin:18px 0 6px;font-weight:800;font-variation-settings:"wdth" 70;font-size:15px;color:var(--muted);text-transform:capitalize}
.month:first-child{margin-top:0}
.gig{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;cursor:pointer}
.gig:hover{border-color:var(--ink)}
.gig.sel{outline:2px solid var(--accent)}
.gig .day{text-align:center;line-height:1}
.gig .day b{display:block;font-size:28px;font-weight:800;font-variation-settings:"wdth" 62;font-variant-numeric:tabular-nums}
.gig .day span{font-size:11px;color:var(--muted);text-transform:capitalize}
.gig .what{min-width:0}
.gig .what b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig .what small{color:var(--muted)}
.gig .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gig .fee{font-variant-numeric:tabular-nums;font-size:13px}
.pick{display:flex;gap:4px}
.pick button{width:24px;height:22px;padding:0;font-size:11px}
.pick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Tables éditables */
.tbl-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--soft);font-weight:700;font-size:12px;color:var(--muted);z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td input,td select{border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;width:100%;min-width:90px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--panel);outline:none}
td input[type=number]{text-align:right;min-width:80px}
td input[type=checkbox]{width:auto;min-width:0}
td.sticky{position:sticky;left:0;background:var(--panel);z-index:1}
.done-cell input{color:var(--ok);font-weight:600}

/* Fiche production */
.prod-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.prod-head{display:grid;grid-template-columns:58px 1fr auto auto;gap:14px;align-items:center;padding:10px 12px;cursor:pointer}
.prod-head .day b{display:block;font-size:26px;font-weight:800;font-variation-settings:"wdth" 62;line-height:1;text-align:center}
.prod-head .day span{display:block;font-size:11px;color:var(--muted);text-align:center;text-transform:capitalize}
.progress{display:flex;gap:3px}
.progress i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.progress i.ok{background:var(--st-conf)}
.prod-body{border-top:1px solid var(--line);padding:14px;display:grid;grid-template-columns:1fr 1.4fr;gap:20px}
.prod-body h4{margin:0 0 8px;font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.steps label{font-size:13px}
.steps input{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.override{color:var(--warn);font-weight:700}
.drive{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
.drive .err{color:var(--danger)}

/* Suivi */
.suivi{margin-bottom:12px;padding:12px 14px;scroll-margin-top:80px}
.suivi-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.suivi-head .spacer{flex:1}
.suivi-sel select{border:1px solid var(--line);border-radius:var(--radius);padding:5px 8px;background:var(--panel);font-weight:600}
.suivi-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.suivi-block{margin-bottom:14px}
.suivi-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.md{font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.md .md-li{position:relative}
.md .md-li::before{content:"•";position:absolute;margin-left:-11px;color:var(--muted)}
.md .md-h{font-weight:700;margin-top:6px}
.md .md-q{border-left:3px solid var(--line);padding-left:8px;color:var(--muted)}
.md .md-sp{height:6px}
.log-form{display:grid;grid-template-columns:auto auto 1fr;gap:6px;margin-bottom:10px}
.log-form textarea{grid-column:1/-1;min-height:64px}
.log-form input,.log-form select,.log-form textarea{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.log-form button{grid-column:1/-1;justify-self:start}
.log{border-top:1px solid var(--line);padding:8px 0}
.log-head{display:flex;align-items:center;gap:6px;font-size:13px}
.log-head .btn{margin-left:auto}
.file-row{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0}
.struct-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:13px}
.contact-row{display:flex;flex-wrap:wrap;gap:4px 10px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.contact-row:first-of-type{border-top:0}
.pst{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pst.Interest{color:var(--st-int)} .pst.Option{color:var(--st-opt)} .pst.Confirmed{color:var(--st-conf)} .pst.Closed{color:var(--st-off)}

/* Projets */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{padding:14px;cursor:pointer}
.pcard:hover{border-color:var(--ink)}
.pcard h3{margin:0 0 4px;font-size:18px;font-variation-settings:"wdth" 80}
.pcard .stats{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:8px}
.pcard .stats b{color:var(--ink);font-size:16px;display:block}
.section-title{margin:24px 0 10px;font-size:15px;font-weight:800;color:var(--muted)}

/* To Do */
.urg{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.urg.late{background:var(--danger);color:#fff}
.urg.today{background:#7B2FBF;color:#fff}
.urg.crit{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.urg.high{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.urg.med{background:var(--soft);color:var(--muted)}
.urg.low{color:var(--muted)}
.task-done td{opacity:.5}

/* Modale */
dialog{border:0;border-radius:10px;padding:0;width:min(720px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,18,26,.45)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:18px;flex:1}
.modal-body{padding:16px 18px;max-height:70vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.modal-body .full{grid-column:1/-1}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.field textarea{min-height:80px;resize:vertical}
.field.check{display:flex;align-items:center;gap:8px}
.field.check input{width:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.modal-foot .left{margin-right:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}

/* Connexion */
.login{max-width:380px;margin:12vh auto;padding:28px}
.login h1{font-size:30px;font-weight:800;font-variation-settings:"wdth" 70;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 18px}
.login input{width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;background:var(--panel)}

.empty{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:var(--radius);z-index:2000;font-weight:600}
.toast.err{background:var(--danger);color:#fff}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);margin:1px}

@media (max-width:1000px){
  .booking{grid-template-columns:1fr}
  .booking .map-wrap{position:static}
  #map{height:380px}
  .prod-body{grid-template-columns:1fr}
  .suivi-grid,.struct-top{grid-template-columns:1fr}
  .modal-body{grid-template-columns:1fr}
}
@media (max-width:600px){
  main{padding:12px 16px}
  .top-row{padding:8px 16px}
  .search{min-width:0;width:100%}
  .filters{width:100%}
  .filters select{flex:1;min-width:0}
  .who{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<dialog id="modal"></dialog>

<script>
'use strict';
const CFG = window.ARTBO_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

// ─────────────────────────── Constantes métier ───────────────────────────
const STATUSES = ['Booking','Intérêt Salle','Intérêt Festival','Option Salle','Option Festival','Option Artiste',
  'Confirmée Salle','Confirmée Festival','Confirmée Artiste','Annulée','Sans Suite'];
const CONFIRMED_PROD = ['Confirmée Salle','Confirmée Festival'];
const CONTRACTS = ['Cession','Co-Réalisation','Production','Co-Production','N.C'];
const TICKETING = ['Payant/Prix Libre','Gratuit'];
const POSTER = ['Quantité à demander','En attente des quantités souhaitées','En attente de commande',"En attente d'expédition",'Expédiée','Livrée','Non concerné'];
const PROSPECT = ['Mailed','Interest','Option','Confirmed','Closed'];
const TASK_STATUS = ['To Do','In Progress','Done','Cancelled'];
const PRIORITIES = ['D-Day','Critical','High','Medium','Low'];
const DEPARTMENTS = ['Booking','Production','Communication','Admin','Accounting','Projects'];
const PAY_KINDS = {acompte:'Acompte', solde:'Solde', artbo:"Commission L'ArtBo", partner:'Commission partenaire', cnm:'Taxe CNM', autre:'Autre'};
const PROD_STEPS = [
  ['conf_kit_sent','Conf + FT + kit promo'],
  ['contract_sent','Contrat envoyé'],
  ['contract_signed','Contrat signé'],
  ['contract_cosigned_sent','Contrat co-signé renvoyé'],
  ['boucle_tech','Boucle technique'],
];
const stClass = s => !s ? 'book' : s.startsWith('Intérêt') ? 'int' : s.startsWith('Option') ? 'opt' : s.startsWith('Confirmée') ? 'conf' : (s==='Annulée'||s==='Sans Suite') ? 'off' : 'book';
const stColor = s => getComputedStyle(document.documentElement).getPropertyValue('--st-' + {int:'int',opt:'opt',conf:'conf',off:'off',book:'book'}[stClass(s)]).trim();

// ─────────────────────────── État ───────────────────────────
const S = {
  user:null, view: localGet('view') || 'booking',
  year: Number(localGet('year')) || new Date().getFullYear(),
  project: localGet('project') || '',
  db: {structures:[], contacts:[], contact_structures:[], projects:[], partners:[], shows:[], show_payments:[], prospects:[], prospect_logs:[], prospect_files:[], tasks:[], settings:[]},
  openProd: new Set(), routePick: {a:null,b:null}, routeCache: {}, search:{},
  showCancelled:false, projectPage:null, structurePage:null, focusProspect:null,
};
function localGet(k){ try { return localStorage.getItem('artbo.'+k); } catch(e){ return null; } }
function localSet(k,v){ try { localStorage.setItem('artbo.'+k, v); } catch(e){} }

// ─────────────────────────── Utilitaires ───────────────────────────
const $ = (sel, root=document) => root.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => n==null || n==='' || isNaN(n) ? '—' : Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtDate = d => d ? new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : '';
const byId = (t,id) => S.db[t].find(r => r.id === id);
const projName = id => byId('projects', id)?.name || '';
const structName = id => byId('structures', id)?.name || '';
const daysUntil = d => d ? Math.round((new Date(d+'T00:00:00') - new Date(new Date().toDateString())) / 86400000) : null;
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:1800); }
function setting(k){ const s = S.db.settings.find(x=>x.key===k); return s ? s.value : null; }

function showsFiltered({year=true}={}){
  return S.db.shows.filter(s =>
    (!S.project || s.project_id === S.project) &&
    (!year || !s.date || Number(s.date.slice(0,4)) === S.year)
  ).sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999'));
}
function showCoords(s){
  if (s.lat!=null && s.lng!=null) return [s.lat, s.lng];
  const st = byId('structures', s.structure_id);
  if (st && st.lat!=null && st.lng!=null) return [st.lat, st.lng];
  return null;
}
function paymentsOf(showId){ return S.db.show_payments.filter(p=>p.show_id===showId).sort((a,b)=>(a.sort||0)-(b.sort||0)); }
function payAmount(p){
  if (p.amount!=null && p.amount!=='') return Number(p.amount);
  const s = byId('shows', p.show_id); const fee = Number(s?.fee_ht)||0;
  if (p.kind==='artbo')   return Math.round(fee * (Number(p.pct ?? s.artbo_pct)||0)) / 100;
  if (p.kind==='partner') return Math.round(fee * (Number(s.artbo_pct)||0) * (Number(p.pct ?? s.partner_pct)||0) / 100) / 100;
  if (p.kind==='cnm' || p.pct==null || p.pct==='') return null;
  return Math.round(fee * Number(p.pct)) / 100;
}
function netArtbo(s){
  const pays = paymentsOf(s.id);
  const a = pays.filter(p=>p.kind==='artbo').reduce((t,p)=>t+(payAmount(p)||0),0);
  const b = pays.filter(p=>p.kind==='partner').reduce((t,p)=>t+(payAmount(p)||0),0);
  return a-b;
}
function payPct(p){
  const s = byId('shows', p.show_id);
  if (p.pct!=null) return p.pct;
  if (p.kind==='artbo') return s?.artbo_pct;
  if (p.kind==='partner') return s?.partner_pct;
  return null;
}

// ─────────────────────────── Données ───────────────────────────
async function loadAll(){
  const tables = Object.keys(S.db);
  const res = await Promise.all(tables.map(t => fetchAll(t)));
  tables.forEach((t,i) => S.db[t] = res[i]);
}
async function fetchAll(table){
  let out = [], from = 0, size = 1000;
  for(;;){
    const {data, error} = await sb.from(table).select('*').range(from, from+size-1);
    if (error) { toast(`Chargement ${table} : ${error.message}`, true); return out; }
    out = out.concat(data); if (data.length < size) return out; from += size;
  }
}
async function save(table, id, patch, {rerender=true}={}){
  const row = byId(table, id); const before = row ? {...row} : null;
  if (row) Object.assign(row, patch);
  const {data, error} = await sb.from(table).update(patch).eq('id', id).select().single();
  if (error){ if (row) Object.assign(row, before); toast('Enregistrement impossible : '+error.message, true); render(); return; }
  Object.assign(row, data);
  if (table==='shows' && patch.status) await refreshShowSide(id);
  if (rerender) render();
}
async function insert(table, values){
  const {data, error} = await sb.from(table).insert(values).select().single();
  if (error){ toast('Création impossible : '+error.message, true); return null; }
  S.db[table].push(data);
  if (table==='shows') await refreshShowSide(data.id);
  return data;
}
async function remove(table, id){
  const {error} = await sb.from(table).delete().eq('id', id);
  if (error){ toast('Suppression impossible : '+error.message, true); return false; }
  S.db[table] = S.db[table].filter(r => r.id !== id);
  return true;
}
// Après une confirmation, la base crée les lignes financières : on les recharge.
async function refreshShowSide(showId){
  const [{data: show}, {data: pays}] = await Promise.all([
    sb.from('shows').select('*').eq('id', showId).single(),
    sb.from('show_payments').select('*').eq('show_id', showId)
  ]);
  if (show){ const i = S.db.shows.findIndex(s=>s.id===showId); if (i>=0) S.db.shows[i]=show; }
  if (pays){ S.db.show_payments = S.db.show_payments.filter(p=>p.show_id!==showId).concat(pays); }
}

function routeBoxHTML(shows){
  const a = byId('shows', S.routePick.a), b = byId('shows', S.routePick.b);
  let pair = '<p class="muted" style="margin:0">Clique sur A puis B sur deux dates pour calculer la route entre elles.</p>';
  if (a && b){
    const key = a.id+'|'+b.id, r = S.routeCache[key];
    pair = `<p style="margin:0"><b>${esc(a.venue)}</b> → <b>${esc(b.venue)}</b><br>
      ${r ? (r.error ? `<span class="muted">${esc(r.error)}</span>` : `<b>${r.km} km</b> · ${r.time} de route`) : '<span class="muted">Calcul en cours…</span>'}</p>`;
  }
  const conf = shows.filter(s=>stClass(s.status)==='conf' && s.date && showCoords(s));
  let legs = '';
  for (let i=1;i<conf.length;i++){
    const k = conf[i-1].id+'|'+conf[i].id, r = S.routeCache[k];
    const days = daysUntil(conf[i].date) - daysUntil(conf[i-1].date);
    legs += `<li><span>${fmtDate(conf[i-1].date).slice(0,6)} ${esc(conf[i-1].city||conf[i-1].venue)} → ${fmtDate(conf[i].date).slice(0,6)} ${esc(conf[i].city||conf[i].venue)}</span>
      <span class="km ${r && !r.error && days<=1 && r.km>600 ? 'long':''}">${r ? (r.error?'—':`${r.km} km · ${r.time}`) : '…'}${days>1?` · J+${days}`:''}</span></li>`;
  }
  return `<h3>Trajet</h3>${pair}${legs?`<h3 style="margin-top:12px">Enchaînement des dates confirmées</h3><ul class="legs">${legs}</ul>`:''}`;
}

let MAP, MAP_LAYER;
function drawMap(){
  const el = $('#map'); if (!el) return;
  if (MAP){ MAP.remove(); MAP=null; }
  MAP = L.map(el, {scrollWheelZoom:true}).setView([46.6, 2.4], 6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution:'© OpenStreetMap, © CARTO', maxZoom:18}).addTo(MAP);
  MAP_LAYER = L.layerGroup().addTo(MAP);
  let shows = showsFiltered(); if (!S.showCancelled) shows = shows.filter(s=>stClass(s.status)!=='off');
  const pts = [];
  for (const s of shows){
    const c = showCoords(s); if (!c) continue; pts.push(c);
    L.circleMarker(c, {radius: stClass(s.status)==='conf'?9:7, color:'#fff', weight:2, fillColor: stColor(s.status), fillOpacity:1})
      .bindPopup(`<b>${esc(s.venue)}</b><br>${fmtDate(s.date)} — ${esc(s.city||'')}<br>${esc(s.status)}${s.fee_ht?'<br>'+eur(s.fee_ht):''}`)
      .addTo(MAP_LAYER);
  }
  const conf = shows.filter(s=>stClass(s.status)==='conf' && s.date && showCoords(s));
  if (conf.length>1) L.polyline(conf.map(showCoords), {color: stColor('Confirmée'), weight:2, dashArray:'4 6', opacity:.7}).addTo(MAP_LAYER);
  if (pts.length) MAP.fitBounds(pts, {padding:[30,30], maxZoom:9});
  // routes
  const a = byId('shows', S.routePick.a), b = byId('shows', S.routePick.b);
  const jobs = [];
  if (a && b) jobs.push([a,b,true]);
  for (let i=1;i<conf.length;i++) jobs.push([conf[i-1], conf[i], false]);
  jobs.forEach(([x,y,draw]) => route(x,y).then(r => {
    if (draw && r && r.geometry && MAP) L.geoJSON(r.geometry, {style:{color:'var(--accent)', weight:4, color: getComputedStyle(document.documentElement).getPropertyValue('--accent')}}).addTo(MAP_LAYER);
    const box = $('#route-box'); if (box) box.innerHTML = routeBoxHTML(shows);
  }));
}

async function route(a, b){
  const key = a.id+'|'+b.id; if (S.routeCache[key]) return S.routeCache[key];
  const ca = showCoords(a), cb = showCoords(b);
  if (!ca || !cb) return (S.routeCache[key] = {error:'Lieu non géolocalisé'});
  try{
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${ca[1]},${ca[0]};${cb[1]},${cb[0]}?overview=simplified&geometries=geojson`);
    const j = await r.json(); const rt = j.routes && j.routes[0];
    if (!rt) return (S.routeCache[key] = {error:'Pas d’itinéraire trouvé'});
    const h = Math.floor(rt.duration/3600), m = Math.round((rt.duration%3600)/60);
    return (S.routeCache[key] = {km: Math.round(rt.distance/1000), time: `${h}h${String(m).padStart(2,'0')}`, geometry: rt.geometry});
  }catch(e){ return {error:'Service de calcul indisponible'}; }
}

async function geocode(q){
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
    const j = await r.json(); return j[0] ? {lat:Number(j[0].lat), lng:Number(j[0].lon)} : null;
  }catch(e){ return null; }
}

// ─────────────────────────── To Do ───────────────────────────
function urgency(t){
  if (['Done','Cancelled'].includes(t.status)) return null;
  const d = daysUntil(t.deadline);
  if (d==null) return t.priority ? {cls:{'D-Day':'today',Critical:'crit',High:'high',Medium:'med',Low:'low'}[t.priority]||'med', label:t.priority} : null;
  if (d<0) return {cls:'late', label:`En retard de ${-d} j`};
  if (d===0) return {cls:'today', label:"Aujourd'hui"};
  if (d<=2) return {cls:'crit', label:`J-${d}`};
  if (d<=7) return {cls:'high', label:`J-${d}`};
  if (d<=21) return {cls:'med', label:`J-${d}`};
  return {cls:'low', label:`J-${d}`};
}
function taskSort(a,b){
  const done = t => ['Done','Cancelled'].includes(t.status) ? 1 : 0;
  return done(a)-done(b) || (a.deadline||'9999').localeCompare(b.deadline||'9999');
}
function taskTable(tasks){
  if (!tasks.length) return `<div class="empty panel">Rien à faire ici. Ajoute une tâche avec « Nouvelle tâche ».</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th></th><th>Tâche</th><th>Urgence</th><th>Échéance</th><th>Statut</th><th>Pour</th><th>Projet</th><th>Structure</th><th>Date</th></tr></thead><tbody>
  ${tasks.map(t=>{ const u=urgency(t), sh=byId('shows',t.show_id);
    return `<tr class="${['Done','Cancelled'].includes(t.status)?'task-done':''}">
      <td><input type="checkbox" data-act="toggleTask" data-id="${t.id}" ${t.status==='Done'?'checked':''} aria-label="Marquer comme faite"></td>
      <td class="click" data-act="editTask" data-id="${t.id}" style="white-space:normal;min-width:220px"><b>${esc(t.title)}</b>${t.tags?.length?' '+t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join(''):''}</td>
      <td>${u?`<span class="urg ${u.cls}">${esc(u.label)}</span>`:''}</td>
      <td>${cIn('tasks',t.id,'deadline',t.deadline,'date')}</td>
      <td>${cSel('tasks',t.id,'status',t.status,TASK_STATUS,false)}</td>
      <td>${cSel('tasks',t.id,'assigned_to',t.assigned_to,CFG.TEAM.map(e=>[e,e.split('@')[0]]))}</td>
      <td>${esc(projName(t.project_id))}</td><td>${esc(structName(t.structure_id))}</td>
      <td>${sh?esc(fmtDate(sh.date)+' '+sh.venue):''}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function viewTodo(){
  const f = S.todoFilter || 'open';
  let tasks = S.db.tasks.filter(t => !S.project || t.project_id===S.project);
  if (f==='open') tasks = tasks.filter(t=>!['Done','Cancelled'].includes(t.status));
  if (f==='mine') tasks = tasks.filter(t=>!['Done','Cancelled'].includes(t.status) && t.assigned_to===S.user.email);
  if (f==='late') tasks = tasks.filter(t=>{ const d=daysUntil(t.deadline); return d!=null && d<=7 && !['Done','Cancelled'].includes(t.status); });
  const q = (S.search.todo||'').toLowerCase();
  if (q) tasks = tasks.filter(t => (t.title+' '+projName(t.project_id)+' '+structName(t.structure_id)).toLowerCase().includes(q));
  tasks.sort(taskSort);
  const btn = (k,l) => `<button class="btn small ${f===k?'primary':''}" data-act="todoFilter" data-f="${k}">${l}</button>`;
  return `<div class="view-head"><h1>To Do</h1>${btn('open','À faire')}${btn('mine','Les miennes')}${btn('late','Urgentes (≤ 7 j)')}${btn('all','Toutes')}

    <button class="btn primary" data-act="newTask">Nouvelle tâche</button></div>${taskTable(tasks)}`;
}

const LOG_KINDS = ['Appel','Mail','RDV','Note'];
const LOG_ICON = {Appel:'📞', Mail:'✉️', RDV:'🤝', Note:'📝'};
function logsOf(pid){ return S.db.prospect_logs.filter(l=>l.prospect_id===pid && !l.hidden).sort((a,b)=>(b.date||'0000').localeCompare(a.date||'0000') || (b.sort||0)-(a.sort||0)); }
function filesOf(pid){ return S.db.prospect_files.filter(f=>f.prospect_id===pid).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')); }
function lastExchange(p){ const l = logsOf(p.id).find(x=>x.date); const d = [l?.date, p.last_contact].filter(Boolean).sort().pop(); return d || null; }
function prospectTitle(p){ return [structName(p.structure_id), projName(p.project_id)].filter(Boolean).join(' — ') || p.name; }

// Mise en forme légère du texte importé de Notion (gras, italique, listes, liens)
function md(text){
  if (!text) return '';
  return esc(text).split('\n').map(line => {
    let l = line
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$)/g,'$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    const m = l.match(/^(\s*)(?:-|\d+\.)\s+(.*)$/);
    if (m) return `<div class="md-li" style="padding-left:${m[1].length*8+14}px">${m[2]}</div>`;
    if (/^#{1,3}\s/.test(l)) return `<div class="md-h">${l.replace(/^#{1,3}\s/,'')}</div>`;
    if (/^\s*&gt;\s?/.test(l)) return `<div class="md-q">${l.replace(/^\s*&gt;\s?/,'')}</div>`;
    return l.trim() ? `<div>${l}</div>` : '<div class="md-sp"></div>';
  }).join('');
}

function field(f, v){
  const id = 'fld-'+f.k, cls = 'field'+(f.full?' full':'')+(f.type==='checkbox'?' check':'');
  if (f.type==='checkbox') return `<div class="${cls}"><input id="${id}" type="checkbox" name="${f.k}" ${v?'checked':''}><label for="${id}">${f.label}</label></div>`;
  let input;
  if (f.type==='select') input = `<select id="${id}" name="${f.k}">${f.blank===false?'':'<option value=""></option>'}${f.options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v??'')?'selected':''}>${esc(lab)}</option>`;}).join('')}</select>`;
  else if (f.type==='textarea') input = `<textarea id="${id}" name="${f.k}">${esc(v??'')}</textarea>`;
  else if (f.type==='tags') input = `<input id="${id}" name="${f.k}" value="${esc((v||[]).join(', '))}" placeholder="séparés par des virgules" list="${f.list||''}">`;
  else if (f.type==='links') input = linksPicker(f, v);
  else input = `<input id="${id}" type="${f.type||'text'}" name="${f.k}" value="${esc(v??'')}" ${f.type==='number'?'step="any"':''}>`;
  return `<div class="${cls}"><label for="${id}">${f.label}</label>${input}</div>`;
}
function linksPicker(f, ids){
  const src = S.db[f.source];
  return `<div class="chips" data-links="${f.k}">${(ids||[]).map(id=>{const r=src.find(x=>x.id===id); return r?`<span class="chip" data-lid="${id}">${esc(r[f.labelKey])}<button type="button" data-act="unlink" aria-label="Retirer">✕</button></span>`:'';}).join('')}</div>
    <input list="dl-${f.k}" placeholder="Taper pour ajouter…" data-linkinput="${f.k}">
    <datalist id="dl-${f.k}">${src.map(r=>`<option value="${esc(r[f.labelKey])}">`).join('')}</datalist>`;
}
document.addEventListener('change', e => {
  const k = e.target.dataset.linkinput; if (!k) return;
  const f = MODAL.fields.find(x=>x.k===k); const r = S.db[f.source].find(x=>x[f.labelKey]===e.target.value);
  if (!r) return; const box = $(`[data-links="${k}"]`);
  if (!box.querySelector(`[data-lid="${r.id}"]`)) box.insertAdjacentHTML('beforeend', `<span class="chip" data-lid="${r.id}">${esc(r[f.labelKey])}<button type="button" data-act="unlink" aria-label="Retirer">✕</button></span>`);
  e.target.value='';
});

let MODAL = null;
function openModal({title, fields, values={}, onSave, onDelete, extra=''}){
  MODAL = {fields, onSave, onDelete};
  const dlg = $('#modal');
  dlg.innerHTML = `<form method="dialog" id="mform">
    <div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="btn ghost" data-act="closeModal" aria-label="Fermer">✕</button></div>
    <div class="modal-body">${fields.map(f=>field(f, values[f.k])).join('')}${extra}</div>
    <div class="modal-foot">${onDelete?'<button type="button" class="btn danger left" data-act="modalDelete">Supprimer</button>':''}
      <button type="button" class="btn" data-act="closeModal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`;
  dlg.showModal();
  $('#mform').onsubmit = async ev => {
    ev.preventDefault();
    const out = {};
    for (const f of fields){
      if (f.type==='links'){ out[f.k] = [...document.querySelectorAll(`[data-links="${f.k}"] [data-lid]`)].map(c=>c.dataset.lid); continue; }
      const el = ev.target.elements[f.k]; if (!el) continue;
      let v = f.type==='checkbox' ? el.checked : el.value;
      if (f.type==='number') v = v===''?null:Number(v);
      else if (f.type==='tags') v = v.split(',').map(x=>x.trim()).filter(Boolean);
      else if (v==='') v = null;
      out[f.k] = v;
    }
    const ok = await onSave(out);
    if (ok!==false){ dlg.close(); render(); }
  };
}

async function fillCoords(row, fallbackQuery){
  if (row.lat!=null && row.lng!=null) return;
  if (!fallbackQuery) return;
  const g = await geocode(fallbackQuery); if (g){ row.lat=g.lat; row.lng=g.lng; }
}

function editShow(id, projectId){
  const s = id ? byId('shows', id) : {status:'Intérêt Salle', project_id: projectId||null, communication_enabled:true, date:null};
  openModal({
    title: id ? s.venue : 'Nouvelle date', fields: showFields(), values: s,
    extra: (id && s.structure_id ? `<div class="full"><a href="#" data-act="openStructure" data-id="${s.structure_id}">Ouvrir la fiche structure et son suivi</a></div>` : '') + (id && s.status?.startsWith('Confirmée') ? `<div class="full drive">${driveHTML(s)}</div>` : ''),
    onDelete: id ? () => remove('shows', id) : null,
    onSave: async v => {
      if (!v.venue) { toast('Indique le nom du lieu', true); return false; }
      const st = byId('structures', v.structure_id);
      if (st){ v.city = v.city || st.city; }
      const changedPlace = !id || v.city!==s.city || v.structure_id!==s.structure_id;
      if (changedPlace){ v.lat=null; v.lng=null;
        if (st && st.lat!=null){ v.lat=st.lat; v.lng=st.lng; }
        else await fillCoords(v, [v.city, v.department && /^\d/.test(v.department) ? 'France' : ''].filter(Boolean).join(', '));
      }
      if (id) await save('shows', id, v, {rerender:false}); else await insert('shows', v);
      if (CONFIRMED_PROD.includes(v.status) && !CONFIRMED_PROD.includes(s.status)) toast('Date confirmée : lignes de facturation et dossier Drive créés');
    }
  });
}

async function syncLinks(kind, id, ids){
  const col = kind==='contact' ? 'contact_id' : 'structure_id', other = kind==='contact' ? 'structure_id' : 'contact_id';
  const current = S.db.contact_structures.filter(l=>l[col]===id).map(l=>l[other]);
  const add = ids.filter(x=>!current.includes(x)), del = current.filter(x=>!ids.includes(x));
  if (add.length){ const rows = add.map(x=>({[col]:id,[other]:x})); const {error}=await sb.from('contact_structures').insert(rows); if(!error) S.db.contact_structures.push(...rows); else toast(error.message,true); }
  for (const x of del){ await sb.from('contact_structures').delete().eq(col,id).eq(other,x); S.db.contact_structures = S.db.contact_structures.filter(l=>!(l[col]===id && l[other]===x)); }
}

function editContact(id){
  const c = id ? byId('contacts', id) : {};
  const links = id ? linksOfContact(id).map(s=>s.id) : [];
  openModal({ title: id ? c.display_name : 'Nouveau contact', values: {...c, _structures: links},
    fields: [
      {k:'first_name', label:'Prénom'}, {k:'last_name', label:'Nom'},
      {k:'_structures', label:'Structures', type:'links', source:'structures', labelKey:'name', full:true},
      {k:'roles', label:'Poste(s)', type:'tags', full:true},
      {k:'email', label:'Mail', type:'email'}, {k:'email_2', label:'Mail 2', type:'email'},
      {k:'phone', label:'Téléphone'}, {k:'phone_2', label:'Téléphone 2'},
      {k:'notes', label:'Notes', type:'textarea', full:true},
    ],
    onDelete: id ? () => remove('contacts', id) : null,
    onSave: async v => {
      const ids = v._structures; delete v._structures;
      v.display_name = [v.first_name, v.last_name].filter(Boolean).join(' ') || c.display_name || v.email;
      if (!v.display_name){ toast('Indique au moins un nom', true); return false; }
      let row; if (id){ await save('contacts', id, v, {rerender:false}); row={id}; } else row = await insert('contacts', v);
      if (row) await syncLinks('contact', row.id, ids);
    }
  });
}

function editStructure(id){
  const s = id ? byId('structures', id) : {country:'France'};
  const links = id ? linksOfStructure(id).map(c=>c.id) : [];
  const shows = id ? S.db.shows.filter(x=>x.structure_id===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')) : [];
  openModal({ title: id ? s.name : 'Nouvelle structure', values: {...s, _contacts: links},
    fields: [
      {k:'name', label:'Nom', full:true},
      {k:'_contacts', label:'Contacts', type:'links', source:'contacts', labelKey:'display_name', full:true},
      {k:'tags', label:'Tags (Festival, SMAC, Salle…)', type:'tags', full:true},
      {k:'address', label:'Adresse', full:true},
      {k:'postal_code', label:'Code postal'}, {k:'city', label:'Ville'},
      {k:'region', label:'Région'}, {k:'country', label:'Pays'},
      {k:'capacity_1', label:'Jauge 1', type:'number'}, {k:'capacity_2', label:'Jauge 2', type:'number'},
      {k:'pricing', label:'Tarif', type:'select', options:['Payant','Gratuit','Prix Libre']}, {k:'website', label:'Site web'},
      {k:'notes', label:'Notes', type:'textarea', full:true},
    ],
    extra: shows.length ? `<div class="full"><label class="muted" style="font-size:12px;font-weight:600">Historique des dates</label>${shows.map(x=>`<div>${fmtDate(x.date)} — ${esc(projName(x.project_id))} <span class="st ${stClass(x.status)}">${esc(x.status)}</span></div>`).join('')}</div>` : '',
    onDelete: id ? () => remove('structures', id) : null,
    onSave: async v => {
      const ids = v._contacts; delete v._contacts;
      if (!v.name) return false;
      if (!id || v.address!==s.address || v.city!==s.city){ v.lat=null; v.lng=null; await fillCoords(v, [v.address, v.postal_code, v.city, v.country].filter(Boolean).join(', ')); }
      let row; if (id){ await save('structures', id, v, {rerender:false}); row={id}; } else row = await insert('structures', v);
      if (row) await syncLinks('structure', row.id, ids);
    }
  });
}

function editProspect(id){
  const p = id ? byId('prospects', id) : {status:'Mailed', project_id:S.project||null, name:'Suivi', structure_id:S.newSuiviStructure||null};
  openModal({ title: id ? p.name : 'Nouveau suivi', values: p,
    fields: [
      {k:'structure_id', label:'Structure', type:'select', options:optsOf('structures'), full:true},
      {k:'status', label:'Statut', type:'select', options:PROSPECT, blank:false},
      {k:'last_contact', label:'Dernier contact', type:'date'},
      {k:'project_id', label:'Projet', type:'select', options:optsOf('projects')},
      {k:'summary', label:'Résumé', type:'textarea', full:true},
    ],
    onDelete: id ? () => remove('prospects', id) : null,
    onSave: async v => {
      if (!v.structure_id){ toast('Choisis la structure', true); return false; }
      v.name = v.name || p.name || 'Suivi';
      if (id) await save('prospects', id, v, {rerender:false});
      else { const row = await insert('prospects', {...v, name:'Suivi'}); if (row){ S.view='structures'; S.structurePage=row.structure_id; S.focusProspect=row.id; } }
    }
  });
}

document.addEventListener('submit', async e => {
  const pid = e.target.dataset?.logform; if (!pid) return; e.preventDefault();
  const f = e.target.elements;
  if (!f.body.value.trim() && !f.who.value.trim()) return toast("Écris au moins une note ou l'interlocuteur", true);
  const row = await insert('prospect_logs', {prospect_id:pid, date:f.date.value||null, kind:f.kind.value, contact_name:f.who.value.trim()||null, body:f.body.value.trim()||null, author:S.user.email});
  if (row){ const p=byId('prospects',pid); if (row.date && (!p.last_contact || row.date>p.last_contact)) await save('prospects', pid, {last_contact:row.date}, {rerender:false}); S.focusProspect=pid; render(); toast('Ajouté au journal'); }
});
document.addEventListener('change', async e => {
  const pid = e.target.dataset?.upload; if (!pid) return;
  const files = [...e.target.files]; if (!files.length) return;
  toast(`Envoi de ${files.length} fichier(s)…`);
  for (const file of files){
    const safe = file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_');
    const path = `${pid}/${Date.now()}_${safe}`;
    const {error} = await sb.storage.from('suivi').upload(path, file, {contentType: file.type||'application/octet-stream'});
    if (error){ toast(`${file.name} : ${error.message}`, true); continue; }
    await insert('prospect_files', {prospect_id:pid, name:file.name, path, size:file.size, mime:file.type||null});
  }
  S.focusProspect=pid; render(); toast('Fichier(s) ajouté(s)');
});

// ─────────────────────────── Connexion ───────────────────────────
function loginHTML(){
  return `<div class="panel login"><h1>L'ArtBoristerie</h1><p>Matrice booking & production.</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="prenom@lartboristerie.com" required autocomplete="email">
      <input type="password" id="login-pw" placeholder="Mot de passe" required autocomplete="current-password">
      <button class="btn primary" style="width:100%">Se connecter</button></form>
    <p id="login-msg" class="muted" style="margin-top:12px"></p></div>`;
}
document.addEventListener('submit', async e => {
  if (e.target.id!=='login-form') return; e.preventDefault();
  const email = $('#login-email').value.trim().toLowerCase();
  if (!CFG.TEAM.includes(email)){ $('#login-msg').textContent = "Cette adresse n'a pas accès à la matrice."; return; }
  $('#login-msg').textContent = 'Connexion…';
  const {data, error} = await sb.auth.signInWithPassword({email, password: $('#login-pw').value});
  if (error){ $('#login-msg').textContent = 'Connexion impossible : mail ou mot de passe incorrect.'; return; }
  S.user = data.user; $('#app').innerHTML = '<div class="empty">Chargement…</div>'; await loadAll(); render();
});
ACTIONS.changePw = async () => {
  const pw = prompt('Nouveau mot de passe (8 caractères minimum)');
  if (!pw) return;
  if (pw.length < 8) return toast('Le mot de passe doit faire au moins 8 caractères', true);
  const {error} = await sb.auth.updateUser({password: pw});
  toast(error ? 'Changement impossible : '+error.message : 'Mot de passe changé', !!error);
};

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  S.user = session?.user || null;
  if (S.user){ $('#app').innerHTML = '<div class="empty">Chargement…</div>'; await loadAll(); }
  render();
  sb.auth.onAuthStateChange(async (ev, session) => {
    if (ev==='SIGNED_IN' && !S.user){ S.user=session.user; await loadAll(); render(); }
    if (ev==='SIGNED_OUT'){ S.user=null; render(); }
  });
}
boot();
</script>
